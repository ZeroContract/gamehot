name: Fetch Game News

on:
  # 定时已改由本地 Mac mini (launchd) 负责，Hermes browser 需要本地环境
  # schedule:
  #   - cron: "*/30 * * * *"
  # 保留手动触发作为备用（CI 无 Hermes，走 cheerio 降级模式）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Fetch and score news
        run: npx tsx scripts/fetch.ts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          if ! git diff --staged --quiet; then
            git commit -m "🤖 自动抓取游戏新闻 $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
